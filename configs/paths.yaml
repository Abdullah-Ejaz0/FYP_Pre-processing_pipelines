# Paths are resolved relative to the repo root (the parent of this configs/ folder).
# Raw datasets are never moved into the repo — they stay as sibling folders.

raw_data:
  montgomery: "../Montgomery-County-CXR-Set/MontgomerySet"
  shenzhen: "../Shenzhen-Hospital-CXR-Set"

# Where processed outputs (images, masks, QC contact sheets) get written.
# Outside the repo and outside the two raw folders, per CLAUDE.md Section 3.
output_root: "../data_processed"

# Small, text-only artifacts (manifests, hash logs, split tables) live inside the repo
# and are committed to git.
manifests_dir: "manifests"

seed: 42

# Only 512 is stored on disk. 256 is produced by downsampling the 512 PNG in the dataloader at
# load time, not by a separate resize-from-original pass -- halves the stored file count and disk
# footprint. This is a deliberate deviation from the proposal's literal "write both from the
# original" instruction (CLAUDE.md Section 6) -- accepted because a 512->256 bicubic downsample is
# a very close approximation of an original->256 resize, and the disk/file-count savings matter
# more at this project's scale than the small difference would.
resolutions: [512]
